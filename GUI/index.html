<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Water Level Controller</title>

    <meta name="description"
        content="A Simplified version of Water level controller Interface using HTML5 and javascript" />
    <meta name="keywords" content="HTML5,CSS,JavaScript,IOT">
    <meta name="author" content="tipsforiot.wordpress.com - Ricardo Santos">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://www.apache.org/licenses/LICENSE-2.0" rel="license" type="text/html" />

    <link href="Content/images/favicon.ico" rel="shortcut icon">
    <script src="Scripts/jquery-3.7.1.min.js" type="text/javascript"></script>

    <link href="Content/SiteStyles.css" rel="stylesheet" type="text/css" />

    <script src="Scripts/WCI.Script.js" type="text/javascript"></script>
    <script src="Scripts/Netzgesta.Gauge.js" type="text/javascript"></script>
  
    <script type="text/javascript">
        $(document).ready(function () {

            // Initialize Widgets
			initWidgets();
			// Initialize Gauges
			onWindowChange(widthSmall);
            //Starts pump control buttons
            controlPump();
            // Update readings and status cyclic at 2000ms
            getControlsInterval();
        });
    </script>
</head>

<body>
        <!-- NavBar -->
  <nav>
    <ul>
      <li><a href="#"> &emsp;Water Controller</a></li>
      <li><a href="#">Graph&emsp;</a></li>
    </ul>
  </nav>
         <!-- NavBar -->
    <div  id="controls" class="controls" >
            <div id="paneldiv" class="panel">
                <div id="groundtkdiv" class="controlsContainer">
                    <p class="label">Cisterna</p>
                    <div id="GroundTK">
                    </div>
                    <p id="volumeGTK" class="label">---- Lts</p>
                </div>
                
                <div id="pumpdiv" class="controlsContainer">
                    <p class="label">Bomba</p>
                    <input type="button" id="manualAutoButton" value="Auto" class="settingLabel" />
                    <img id="pump" alt="pump" class= "pumpIcon"src="Content/images/pumpRound_Off.png">
                    <input type="button" id="onOffButton" value="OFF" class="settingLabel" />

                    <div id="spinnerdiv" style="margin-top: 10px; height:40px; width:60px "> 
                        <div id="waiting" style="display: none">
                            <br>
                            <div class="loader" style="margin: auto"></div>
                        </div>
                    </div>

                </div>
                
                <div id="headtkdiv" class="controlsContainer">
                    <p class="label">Caixa D'água</p>
                    <div id="HeadTK">
                    </div>
                    <p id="volumeHTK" class="label">---- Lts</p>
                </div>
            </div>
            <!-- Show error messages and infos -->
            <div id="statustextdiv" style="height:120px; margin: 10px ;">
                <p class="messageBox">Status:</p>
                <p id="statustext" class="messageBox"></p>
            </div>
    </div>
</body>

</html>
